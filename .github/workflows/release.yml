name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: nuvio-inputs-${{ hashFiles('deps.lock') }}
      - name: Install host tools
        run: brew install llvm coreutils
      - name: Add LLVM and coreutils to PATH
        run: |
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check
        run: make check
      - name: Build
        run: make build
      - name: Package
        run: python3 scripts/package_release.py --tag "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Nuvio PS5 ${GITHUB_REF_NAME}")
          case "${GITHUB_REF_NAME}" in *alpha*|*beta*|*rc*) args+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            release/PPSA99997.zip \
            release/nuvio-ps5-*.zip \
            release/helpers/*.elf \
            release/payloads.json \
            release/SHA256SUMS
