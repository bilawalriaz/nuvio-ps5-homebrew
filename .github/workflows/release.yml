name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: .cache
          key: nuvio-inputs-${{ hashFiles('deps.lock') }}
      - name: Install host tools
        run: brew install llvm lld coreutils grep nasm
      - name: Add LLVM, coreutils and grep to PATH
        run: |
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix grep)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check
        run: make check
      - name: Build
        run: make build
      - name: Diagnose build failure
        if: failure()
        run: |
          command -v grep || true
          grep --version 2>&1 | head -3 || true
          file "$(command -v grep)" || true
          echo "LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset}"
          for d in build/EVO-PLAYER-PS5-*/output/app/.build/runtime-shim; do
            [ -d "$d" ] || continue
            ls -l "$d" || true
            f="$d/libc-a.raw.elf"
            shasum -a 256 "$f" || true
            python3 - "$f" <<'PY' || true
          import sys
          data = open(sys.argv[1], 'rb').read()
          print('python size', len(data), 'marker', data.count(b'BlackBearReloaded'))
          PY
            for a in -aFq -aqF -Fq -aq; do
              if grep $a BlackBearReloaded "$f"; then echo "grep $a OK"; else echo "grep $a rc=$?"; fi
            done
            if "$(brew --prefix grep)/bin/ggrep" -aFq BlackBearReloaded "$f"; then
              echo "ggrep OK"
            else
              echo "ggrep rc=$?"
            fi
          done
      - name: Package
        run: python3 scripts/package_release.py --tag "${GITHUB_REF_NAME}"
      - name: Save build inputs
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: nuvio-inputs-${{ hashFiles('deps.lock') }}
      - name: Create draft release
        if: success() && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--draft --title "Nuvio PS5 ${GITHUB_REF_NAME}" --generate-notes)
          case "${GITHUB_REF_NAME}" in *alpha*|*beta*|*rc*) args+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" $(cat release/ASSETS)
